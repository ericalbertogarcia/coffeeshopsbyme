<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Shops By Me</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f1;
    --panel: #ffffff;
    --ink: #2b1d14;
    --muted: #7a6656;
    --line: #eadfd3;
    --accent: #8b4a2b;
    --accent-ink: #ffffff;
    --chip: #f3e8dc;
    --good: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1310; --panel: #241a15; --ink: #f4e9df; --muted: #b39d8b;
      --line: #3a2b22; --accent: #d98a5c; --accent-ink: #1a1310; --chip: #33251d; --good: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 1.5rem; margin: 0; }
  h1 span { color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input, select {
    font: inherit; font-size: .95rem; border-radius: 999px; border: 1px solid var(--line);
    padding: 8px 14px; background: var(--panel); color: var(--ink);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  form { display: flex; gap: 6px; }
  input[type=search] { min-width: 0; width: 200px; }
  main { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
  #list { overflow-y: auto; border-right: 1px solid var(--line); }
  #map { min-height: 300px; }
  #status { padding: 16px; color: var(--muted); }
  .card {
    padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: start;
  }
  .card:hover, .card.active { background: var(--chip); }
  .rank {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 600; font-size: .85rem;
  }
  .name { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .dist { font-weight: 600; font-size: .9rem; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { background: var(--chip); border-radius: 999px; padding: 2px 8px; font-size: .75rem; }
  .card:hover .tag, .card.active .tag { background: var(--panel); }
  .tag.indie { color: var(--good); font-weight: 600; }
  .links a { color: var(--accent); font-size: .85rem; margin-right: 10px; }
  /* Quick-pick cities */
  .cities {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  .cities::-webkit-scrollbar { display: none; }
  .cities .label { color: var(--muted); font-size: .85rem; align-self: center; white-space: nowrap; margin-right: 4px; }
  .cities button { padding: 5px 12px; font-size: .85rem; white-space: nowrap; background: var(--chip); border-color: transparent; }
  .cities button:hover, .cities button.on { background: var(--accent); color: var(--accent-ink); }

  /* "Known for" votes and traveler picks */
  .known { font-size: .82rem; margin-top: 6px; }
  .known b { color: var(--accent); font-weight: 600; }
  .votes { display: none; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .card.voting .votes { display: flex; }
  .vote { padding: 3px 9px; font-size: .78rem; background: var(--panel); border: 1px solid var(--line); }
  .vote.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .vote b { font-weight: 600; margin-left: 2px; }
  .tag.pick { color: var(--accent); font-weight: 600; text-decoration: none; }
  .bestnote { padding: 10px 16px; font-size: .85rem; color: var(--muted); border-bottom: 1px solid var(--line); }

  /* Map markers */
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--accent); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    display: grid; place-items: center; transition: transform .15s;
  }
  .pin span { transform: rotate(45deg); color: var(--accent-ink); font: 600 12px Inter, sans-serif; }
  .pin.small { width: 14px; height: 14px; border-radius: 50%; transform: none; border-width: 2px; opacity: .85; }
  .pin.active { transform: rotate(-45deg) scale(1.3); background: var(--ink); }
  .pin.small.active { transform: scale(1.6); opacity: 1; }
  .me { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(37,99,235,.5); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 16px rgba(37,99,235,0); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }

  /* Softer Leaflet chrome */
  .leaflet-control-zoom { border: 0 !important; box-shadow: 0 2px 8px rgba(0,0,0,.15) !important; border-radius: 12px !important; overflow: hidden; }
  .leaflet-control-zoom a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); border-radius: 12px; }
  .leaflet-popup-content { font-family: Inter, sans-serif; margin: 10px 14px; }
  .leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    #map { order: -1; }
    #list { border-right: 0; }
    input[type=search] { width: 140px; }
  }
</style>
</head>
<body>
<header>
  <h1>☕ Coffee Shops <span>By Me</span></h1>
  <div class="controls">
    <button class="primary" id="locate">📍 Use my location</button>
    <form id="search">
      <input type="search" id="q" placeholder="Or enter a city / address">
      <button type="submit">Go</button>
    </form>
    <select id="radius" aria-label="Search radius">
      <option value="800">0.5 mi</option>
      <option value="1600" selected>1 mi</option>
      <option value="4800">3 mi</option>
      <option value="8000">5 mi</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="best" selected>Best match</option>
      <option value="distance">Closest</option>
    </select>
  </div>
</header>
<nav class="cities" id="cities" aria-label="Popular cities"><span class="label">Popular:</span></nav>
<nav class="cities" id="bestfor" aria-label="Best for" hidden><span class="label">Best for:</span></nav>
<main>
  <div id="list"><div id="status">Tap “Use my location” or search a place to find coffee nearby.</div></div>
  <div id="map"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const map = L.map('map', { zoomSnap: 0.5 }).setView([39.5, -98.35], 4);

// Modern vector basemap from OpenFreeMap (free, no API key); follows light/dark mode.
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
const styleUrl = () => `https://tiles.openfreemap.org/styles/${darkQuery.matches ? 'dark' : 'positron'}`;
const basemap = L.maplibreGL({
  style: styleUrl(),
  attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
}).addTo(map);
darkQuery.addEventListener('change', () => basemap.getMaplibreMap().setStyle(styleUrl()));
map.attributionControl.addAttribution('Traveler picks: <a href="https://en.wikivoyage.org" target="_blank">Wikivoyage</a> (CC BY-SA)');

const CITIES = [
  ['New York', 40.7411, -73.9897], ['Los Angeles', 34.0522, -118.2437], ['Chicago', 41.8827, -87.6233],
  ['San Francisco', 37.7793, -122.4192], ['Seattle', 47.6097, -122.3331], ['Portland', 45.5202, -122.6742],
  ['Austin', 30.2672, -97.7431], ['Boston', 42.3554, -71.0605], ['Miami', 25.7743, -80.1937],
  ['Denver', 39.7392, -104.9903], ['Washington, DC', 38.9007, -77.0365], ['Philadelphia', 39.9526, -75.1652],
  ['Nashville', 36.1627, -86.7816], ['New Orleans', 29.9511, -90.0715], ['San Diego', 32.7157, -117.1611],
];
const citiesEl = document.getElementById('cities');
CITIES.forEach(([name, lat, lon]) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.addEventListener('click', () => {
    citiesEl.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('q').value = name;
    setCenter(lat, lon, false);
  });
  citiesEl.appendChild(b);
});

const pinIcon = (rank, active) => rank <= 10
  ? L.divIcon({ className: '', html: `<div class="pin${active ? ' active' : ''}"><span>${rank}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30] })
  : L.divIcon({ className: '', html: `<div class="pin small${active ? ' active' : ''}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -8] });
let activeMarker = null;

const listEl = document.getElementById('list');
const radiusEl = document.getElementById('radius');
const sortEl = document.getElementById('sort');
let center = null, shops = [], markers = L.layerGroup().addTo(map), meMarker = null;

function setStatus(msg) { listEl.innerHTML = `<div id="status">${msg}</div>`; }

function distanceMeters(a, b) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtMiles = m => (m / 1609.34 < 0.1 ? `${Math.round(m * 3.281)} ft` : `${(m / 1609.34).toFixed(1)} mi`);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// "Best" score: favors independent shops, coffee-focused spots, and well-documented listings,
// with a gentle penalty for distance. OpenStreetMap has no star ratings, so this is a heuristic.
function score(s) {
  const t = s.tags;
  let pts = 0;
  if (!t.brand && !t['brand:wikidata']) pts += 3;            // independent / local
  if (/coffee/i.test(t.cuisine || '') || /coffee|espresso|roast/i.test(t.name || '')) pts += 2;
  if (t.opening_hours) pts += 1;
  if (t.website || t['contact:website']) pts += 1;
  if (t.outdoor_seating === 'yes') pts += 0.5;
  if (t.internet_access && t.internet_access !== 'no') pts += 0.5;
  if (s.pick) pts += 2;                                       // recommended on Wikivoyage
  const votes = Object.values(counts[s.id] || {}).reduce((a, b) => a + b, 0);
  pts += Math.min(3, Math.log2(1 + votes));                   // community votes, capped
  return pts - (s.dist / Number(radiusEl.value)) * 3;
}

// --- Community "Known for" votes (Supabase) --------------------------------
// Paste your Supabase project URL and publishable (anon) key here. Both are meant to be
// public: the rules in setup.sql decide what visitors may do. Leave empty to hide voting.
const SUPABASE_URL = '';
const SUPABASE_KEY = '';

const VOTE_TAGS = [
  ['cappuccino', '☕', 'Cappuccino'], ['latte', '🥛', 'Latte'], ['iced', '🧊', 'Iced coffee'],
  ['coldbrew', '🫗', 'Cold brew'], ['espresso', '⚡', 'Espresso'], ['pourover', '🫖', 'Pour-over'],
  ['matcha', '🍵', 'Matcha'], ['work', '💻', 'Good for working'],
];
const db = SUPABASE_URL && window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let counts = {}, myVotes = new Set(), votesLoaded = new Set(), bestFor = '';

async function loadVotes(ids) {
  ids = ids.filter(id => !votesLoaded.has(id));
  if (!db || !ids.length) return false;
  ids.forEach(id => votesLoaded.add(id));
  const { data: { session } } = await db.auth.getSession();
  for (let i = 0; i < ids.length; i += 100) {
    const chunk = ids.slice(i, i + 100);
    const [all, mine] = await Promise.all([
      db.from('place_tag_counts').select('place_id,tag,votes').in('place_id', chunk),
      session ? db.from('votes').select('place_id,tag').in('place_id', chunk) : { data: [] },
    ]);
    (all.data || []).forEach(r => (counts[r.place_id] ||= {})[r.tag] = r.votes);
    (mine.data || []).forEach(r => myVotes.add(r.place_id + ':' + r.tag));
  }
  return true;
}

async function toggleVote(id, tag) {
  const key = id + ':' + tag, had = myVotes.has(key), c = (counts[id] ||= {});
  const show = voted => {
    voted ? myVotes.add(key) : myVotes.delete(key);
    c[tag] = Math.max(0, (c[tag] || 0) + (voted ? 1 : -1));
    refreshVotes(id);
  };
  show(!had); // update the screen right away, then save
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { const r = await db.auth.signInAnonymously(); if (r.error) throw r.error; }
    const res = had
      ? await db.from('votes').delete().match({ place_id: id, tag })
      : await db.from('votes').insert({ place_id: id, tag });
    if (res.error) throw res.error;
  } catch {
    show(had);
    alert('Sorry, your vote couldn’t be saved. Please try again.');
  }
}

function knownHtml(id) {
  const top = VOTE_TAGS.map(([tag, emoji, label]) => [emoji, label, counts[id]?.[tag] || 0])
    .filter(x => x[2] > 0).sort((a, b) => b[2] - a[2]).slice(0, 3);
  return top.length ? `Known for: ${top.map(([e, l, n]) => `${e} ${l} <b>${n}</b>`).join(' · ')}` : '';
}
function chipsHtml(id) {
  return VOTE_TAGS.map(([tag, emoji, label]) => {
    const n = counts[id]?.[tag] || 0, on = myVotes.has(id + ':' + tag);
    return `<button class="vote${on ? ' on' : ''}" data-tag="${tag}" title="${on ? 'Tap to remove your vote' : `Great ${label.toLowerCase()} here? Tap to agree`}">${emoji} ${label}${n ? ` <b>${n}</b>` : ''}</button>`;
  }).join('');
}
function refreshVotes(id) {
  const card = listEl.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  card.querySelector('.known').innerHTML = knownHtml(id);
  card.querySelector('.votes').innerHTML = chipsHtml(id);
}

const bestForEl = document.getElementById('bestfor');
if (db) {
  bestForEl.hidden = false;
  [['', '', 'Anything']].concat(VOTE_TAGS).forEach(([tag, emoji, label]) => {
    const b = document.createElement('button');
    b.textContent = `${emoji} ${label}`.trim();
    if (!tag) b.classList.add('on');
    b.addEventListener('click', () => {
      bestForEl.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      bestFor = tag;
      if (shops.length) render();
    });
    bestForEl.appendChild(b);
  });
}

// --- Traveler picks (Wikivoyage) --------------------------------------------
// Wikivoyage city guides list the cafés travelers recommend. We match those listings to
// nearby shops by name (and location when given) and show a badge. Content is CC BY-SA.
const WV_API = 'https://en.wikivoyage.org/w/api.php?origin=*&format=json&';
let picks = [];

async function fetchTravelerPicks(c) {
  const key = `wv:${c.lat.toFixed(2)},${c.lon.toFixed(2)}`;
  const cached = readCache(key);
  if (cached) return cached;
  const geo = await (await fetch(WV_API + `action=query&list=geosearch&gscoord=${c.lat}|${c.lon}&gsradius=10000&gslimit=10`)).json();
  const titles = (geo.query?.geosearch || []).map(g => g.title);
  const found = [];
  if (titles.length) {
    const res = await (await fetch(WV_API + 'action=query&prop=revisions&rvprop=content&rvslots=main&titles=' + encodeURIComponent(titles.join('|')))).json();
    for (const page of Object.values(res.query.pages)) {
      const text = page.revisions?.[0]?.slots?.main?.['*'] || '';
      for (const m of text.matchAll(/\{\{\s*(?:drink|eat|listing)\b([\s\S]*?)\}\}/gi)) {
        const field = k => (m[1].match(new RegExp(`\\|\\s*${k}\\s*=\\s*([^|]*)`)) || [])[1]?.trim();
        const name = field('name');
        if (name) found.push({ name: name.replace(/&nbsp;.*/, ''), lat: Number(field('lat')) || null, lon: Number(field('long')) || null, page: page.title });
      }
    }
  }
  writeCache(key, found);
  return found;
}

// Names must match exactly after dropping generic words ("Café Grumpy" = "Cafe Grumpy"),
// branch suffixes ("Stumptown – Pearl District") and punctuation. Looser matching
// mistook e.g. "Bryant Park Café" for "Bryant Park Grill".
const normName = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/\s+[-–—(].*$/, '')
  .replace(/\b(the|cafe|caffe|coffee|roasters?|roasting|company|co|bar|shop|house|and)\b/g, '')
  .replace(/[^a-z0-9]/g, '');

function markPicks(list) {
  const named = new Map();
  picks.forEach(p => { const n = normName(p.name); if (n.length >= 3 && !named.has(n)) named.set(n, p); });
  list.forEach(s => {
    const p = named.get(normName(s.tags.name || ''));
    s.pick = p && (!p.lat || !p.lon || distanceMeters(p, s) < 500) ? p : null;
  });
}

// --- Data loading ---------------------------------------------------------
// 1. Nominatim answers in ~1s with up to 40 cafes, so results show right away.
// 2. Overpass returns the complete list but can take 30s+, so it fills in afterwards.
// Results are cached in the browser for a few hours so repeat searches are instant.

const CACHE_HOURS = 6;
const OVERPASS_SERVERS = [
  'https://overpass-api.de/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
];
let searchId = 0, lastNominatim = 0;

const cacheKey = (c, r) => `cafes:${c.lat.toFixed(3)},${c.lon.toFixed(3)},${r}`;
function readCache(key) {
  try {
    const hit = JSON.parse(localStorage.getItem(key));
    if (hit && Date.now() - hit.at < CACHE_HOURS * 3600e3) return hit.shops;
  } catch {}
  return null;
}
function writeCache(key, list) {
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), shops: list })); } catch {}
}

// Nominatim asks apps to send at most one request per second.
async function nominatim(url) {
  const wait = lastNominatim + 1100 - Date.now();
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastNominatim = Date.now();
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

async function fetchQuick(c, r) {
  const dLat = r / 111000, dLon = r / (111000 * Math.cos(c.lat * Math.PI / 180));
  const box = [c.lon - dLon, c.lat + dLat, c.lon + dLon, c.lat - dLat].join(',');
  const hits = await nominatim(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=%5Bcafe%5D&viewbox=${box}&bounded=1&limit=40&extratags=1&addressdetails=1`);
  return hits.filter(h => h.type === 'cafe').map(h => ({
    id: h.osm_type[0] + h.osm_id, lat: Number(h.lat), lon: Number(h.lon),
    tags: { ...h.extratags, name: h.name, 'addr:housenumber': h.address?.house_number, 'addr:street': h.address?.road },
  }));
}

async function fetchFull(c, r) {
  const q = `[out:json][timeout:45];nwr["amenity"="cafe"](around:${r},${c.lat},${c.lon});out center tags qt;`;
  // Ask several free servers at once; use the first one that answers, give up after 60s.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const data = await Promise.any(OVERPASS_SERVERS.map(async url => {
      const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), signal: ctrl.signal });
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }));
    return data.elements.map(e => ({ id: e.type[0] + e.id, lat: e.lat ?? e.center.lat, lon: e.lon ?? e.center.lon, tags: e.tags || {} }));
  } finally {
    clearTimeout(timer);
    ctrl.abort(); // cancel the slower servers
  }
}

let rawShops = [], loadingMore = false;

function useShops(list) {
  rawShops = list;
  shops = list
    .filter(s => s.tags.name)
    .map(s => ({ ...s, dist: distanceMeters(center, s) }))
    .filter(s => s.dist <= Number(radiusEl.value));
  markPicks(shops);
  shops.forEach(s => s.score = score(s));
  render();
  // Fetch vote counts for any shops we haven't seen yet, then re-rank with them.
  const id = searchId;
  loadVotes(shops.map(s => s.id)).then(changed => {
    if (changed && id === searchId) { shops.forEach(s => s.score = score(s)); render(); }
  }).catch(() => {});
}

function setNote(msg) {
  let note = document.getElementById('note');
  if (!msg) return note && note.remove();
  if (!note) { note = document.createElement('div'); note.id = 'note'; note.className = 'meta'; note.style.padding = '8px 16px'; }
  note.textContent = msg;
  listEl.prepend(note);
}

async function findShops() {
  if (!center) return;
  const id = ++searchId, c = center, r = radiusEl.value, key = cacheKey(c, r);
  loadingMore = false;

  // Traveler picks load alongside the shops and get applied whenever they arrive.
  picks = [];
  fetchTravelerPicks(c).then(p => {
    if (id !== searchId || !p.length) return;
    picks = p;
    if (rawShops.length) useShops(rawShops);
  }).catch(() => {});

  const cached = readCache(key);
  if (cached) return useShops(cached);

  rawShops = [];
  setStatus('Brewing results…');
  let quick = [];
  try {
    quick = await fetchQuick(c, r);
    if (id !== searchId) return;
    loadingMore = quick.length > 0;
    if (quick.length) useShops(quick);
    else setStatus('Brewing results… this can take up to a minute.');
  } catch {}

  try {
    const full = await fetchFull(c, r);
    if (id !== searchId) return;
    // Keep any quick results the full list somehow missed.
    const seen = new Set(full.map(s => s.id));
    const merged = full.concat(quick.filter(s => !seen.has(s.id)));
    writeCache(key, merged);
    loadingMore = false;
    useShops(merged);
  } catch {
    if (id !== searchId) return;
    loadingMore = false;
    if (quick.length) setNote('');
    else setStatus('Couldn’t reach the coffee map right now. Please try again in a moment.');
  }
}

function render() {
  markers.clearLayers();
  if (!shops.length) { setStatus('No coffee shops found here. Try a bigger radius.'); return; }
  const votesFor = s => counts[s.id]?.[bestFor] || 0;
  const sorted = [...shops].sort(
    bestFor ? (a, b) => votesFor(b) - votesFor(a) || b.score - a.score
    : sortEl.value === 'distance' ? (a, b) => a.dist - b.dist
    : (a, b) => b.score - a.score);
  // Re-rendering shouldn't lose the reader's place or close an open vote panel.
  const scroll = listEl.scrollTop;
  const voting = new Set([...listEl.querySelectorAll('.card.voting')].map(c => c.dataset.id));
  listEl.innerHTML = '';
  sorted.forEach((s, i) => {
    const t = s.tags;
    const addr = [t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' ');
    const site = t.website || t['contact:website'];
    const dir = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`;
    const tags = [];
    if (s.pick) tags.push(`<a class="tag pick" href="https://en.wikivoyage.org/wiki/${encodeURIComponent(s.pick.page.replace(/ /g, '_'))}" target="_blank" rel="noopener" title="Recommended in the Wikivoyage travel guide">✈️ Traveler pick</a>`);
    if (!t.brand) tags.push('<span class="tag indie">Local</span>');
    else tags.push(`<span class="tag">${esc(t.brand)}</span>`);
    if (t.outdoor_seating === 'yes') tags.push('<span class="tag">Outdoor seating</span>');
    if (t.internet_access && t.internet_access !== 'no') tags.push('<span class="tag">Wi-Fi</span>');
    if (t.opening_hours) tags.push(`<span class="tag">${esc(t.opening_hours)}</span>`);

    const card = document.createElement('div');
    card.className = 'card' + (voting.has(s.id) ? ' voting' : '');
    card.dataset.id = s.id;
    card.innerHTML = `
      <div class="rank">${i + 1}</div>
      <div>
        <div class="name">${esc(t.name)}</div>
        ${addr ? `<div class="meta">${esc(addr)}</div>` : ''}
        <div class="tags">${tags.join('')}</div>
        <div class="known">${knownHtml(s.id)}</div>
        <div class="links" style="margin-top:6px">
          <a href="${dir}" target="_blank" rel="noopener">Directions</a>
          ${site ? `<a href="${esc(site)}" target="_blank" rel="noopener">Website</a>` : ''}
          ${db ? '<a href="#" class="vote-toggle">👍 What’s it known for?</a>' : ''}
        </div>
        <div class="votes">${db ? chipsHtml(s.id) : ''}</div>
      </div>
      <div class="dist">${fmtMiles(s.dist)}</div>`;
    card.querySelector('.vote-toggle')?.addEventListener('click', e => {
      e.preventDefault();
      card.classList.toggle('voting');
    });
    card.querySelector('.votes').addEventListener('click', e => {
      const b = e.target.closest('.vote');
      if (b) toggleVote(s.id, b.dataset.tag);
    });
    const rank = i + 1;
    const m = L.marker([s.lat, s.lon], { icon: pinIcon(rank), zIndexOffset: 1000 - rank, title: t.name })
      .bindPopup(`<b>${esc(t.name)}</b><br>${fmtMiles(s.dist)} away`);
    markers.addLayer(m);
    card.addEventListener('click', e => {
      if (e.target.closest('a, .votes')) return; // links and vote buttons do their own thing
      document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      if (activeMarker) activeMarker.setIcon(pinIcon(activeMarker.rank));
      m.rank = rank; m.setIcon(pinIcon(rank, true)); activeMarker = m;
      map.flyTo([s.lat, s.lon], 17, { duration: 0.6 }); m.openPopup();
    });
    m.on('click', () => { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.click(); });
    listEl.appendChild(card);
  });

  if (bestFor) {
    const [, emoji, label] = VOTE_TAGS.find(x => x[0] === bestFor);
    const voted = shops.filter(s => votesFor(s) > 0).length;
    const note = document.createElement('div');
    note.className = 'bestnote';
    note.textContent = voted
      ? `${emoji} Sorted by ${label.toLowerCase()} votes: ${voted} shop${voted === 1 ? '' : 's'} nearby ${voted === 1 ? 'has' : 'have'} votes.`
      : `${emoji} No one has voted for ${label.toLowerCase()} around here yet. Know a great spot? Tap “What’s it known for?” on it.`;
    listEl.prepend(note);
  }
  if (loadingMore) setNote('Finding more coffee shops…');
  listEl.scrollTop = scroll;
}

function setCenter(lat, lon, clearCity = true) {
  center = { lat, lon };
  activeMarker = null;
  if (clearCity) citiesEl.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  if (meMarker) meMarker.remove();
  meMarker = L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18] }), zIndexOffset: 2000 })
    .addTo(map).bindPopup('Search center');
  map.flyTo([lat, lon], 15, { duration: 1 });
  findShops();
}

document.getElementById('locate').addEventListener('click', () => {
  if (!navigator.geolocation) return setStatus('Your browser doesn’t support location. Search a place instead.');
  setStatus('Finding you…');
  navigator.geolocation.getCurrentPosition(
    p => setCenter(p.coords.latitude, p.coords.longitude),
    () => setStatus('Location access was blocked. Search a city or address instead.'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

document.getElementById('search').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  setStatus('Looking that up…');
  try {
    const [hit] = await nominatim(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    if (!hit) return setStatus('Couldn’t find that place. Try something more specific.');
    setCenter(Number(hit.lat), Number(hit.lon));
  } catch { setStatus('Search is unavailable right now. Please try again.'); }
});

radiusEl.addEventListener('change', findShops);
sortEl.addEventListener('change', () => shops.length && render());
</script>
</body>
</html>
